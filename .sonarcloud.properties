# Escopo da análise do SonarQube Cloud (Análise Automática).
#
# É `.sonarcloud.properties` e NÃO `sonar-project.properties`: a Análise
# Automática ignora o segundo por completo. Ela também NÃO aceita curinga aqui —
# nada de `**/*.sql` —, então só cabe caminho literal de diretório ou arquivo.
# Este arquivo só passa a valer quando estiver na branch PADRÃO do repositório.
#
# POR QUE EXCLUIR, e o número que justifica cada linha. A primeira análise (21/08,
# sobre o `566810e`) devolveu 3.091 achados. Destes, 2.317 — 75% — não são sobre
# o código que escrevemos:
#
#   1.726  `Supabase/`      lido como Oracle PL/SQL, e isto é PostgreSQL
#     591  capturas   um único HTML salvo do navegador
#
# `Supabase/` — O DIALETO ESTÁ ERRADO, e isso não é preciosismo. No Oracle a string
# vazia É NULL; no PostgreSQL não é. O analisador acusou `NullComparison` em
# `where padrao = ''`, `if v_norm = ''` e `coalesce(trim(p_autor), '') = ''` — as
# três corretas aqui, todas denunciadas como bug. Os 9 BLOCKER da primeira análise
# são `DELETE sem WHERE` no teardown de `Supabase/test/`, que roda contra banco local
# descartável recriado a cada execução. Some-se a isso que `Supabase/migrations` é
# IMUTÁVEL (migration aplicada não se reescreve) e `Supabase/schema.sql` é GERADO pelo
# `Supabase/test/run.sh`: achado nesses dois é, por construção, inacionável.
#
# `Dados de Teste/capturas` — é a tela salva do navegador como evidência de rodada,
# 408 KB de HTML de página renderizada. Os 591 `InputWithoutLabelCheck` saem todos
# de UM arquivo. Não é fonte, e acessibilidade se mede no `.tsx` que gera a tela.
#
# O QUE FICA DENTRO, de propósito: `portal/`, `N8N/`, `Verificação/` e os
# geradores Python dos dois books (`Dados de Teste/book-*`) — o oráculo das suítes é
# código de verdade e merece ser lido como tal.
#
# `Supabase` E `Dados de Teste/capturas` NÃO CASAVAM NADA — medido no PR #172. O padrão sem
# `/**` casa um ARQUIVO com aquele nome, não o conteúdo do diretório, então a
# exclusão escrita aqui em 21/08 nunca esteve em vigor. A prova: a análise do
# #172 devolveu `Supabase/migrations/0140_….sql` e `Supabase/schema.sql` entre os arquivos
# medidos, em `plsql`, e reprovou o quality gate por 24 linhas duplicadas — 21
# delas na migration.
#
# E a duplicação que ela acusa é INEVITÁVEL, não desleixo: `create or replace
# function` no PostgreSQL exige o corpo INTEIRO, então toda migration que corrige
# uma função reemite as linhas que não mudaram. A doutrina da `0103` manda fazer
# exatamente isso — uma só definição, para que a função e a explicação dela não
# divirjam. Sem esta linha corrigida, todo PR com migration de função nasce com o
# gate vermelho.
sonar.exclusions=Supabase/**,Dados de Teste/capturas/**
