# Escopo da análise do SonarQube Cloud (Análise Automática).
#
# É `.sonarcloud.properties` e NÃO `sonar-project.properties`: a Análise
# Automática ignora o segundo por completo. Ela também NÃO aceita curinga aqui —
# nada de `**/*.sql` —, então só cabe caminho literal de diretório ou arquivo.
# Este arquivo só passa a valer quando estiver na branch PADRÃO do repositório.
#
# POR QUE EXCLUIR, e o número que justifica cada linha. A primeira análise (21/08,
# sobre o `566810e`) devolveu 3.091 achados. Destes, 2.317 — 75% — não são sobre
# o código que escrevemos:
#
#   1.726  `db/`      lido como Oracle PL/SQL, e isto é PostgreSQL
#     591  capturas   um único HTML salvo do navegador
#
# `db/` — O DIALETO ESTÁ ERRADO, e isso não é preciosismo. No Oracle a string
# vazia É NULL; no PostgreSQL não é. O analisador acusou `NullComparison` em
# `where padrao = ''`, `if v_norm = ''` e `coalesce(trim(p_autor), '') = ''` — as
# três corretas aqui, todas denunciadas como bug. Os 9 BLOCKER da primeira análise
# são `DELETE sem WHERE` no teardown de `db/test/`, que roda contra banco local
# descartável recriado a cada execução. Some-se a isso que `db/migrations` é
# IMUTÁVEL (migration aplicada não se reescreve) e `db/schema.sql` é GERADO pelo
# `db/test/run.sh`: achado nesses dois é, por construção, inacionável.
#
# `test-data/capturas` — é a tela salva do navegador como evidência de rodada,
# 408 KB de HTML de página renderizada. Os 591 `InputWithoutLabelCheck` saem todos
# de UM arquivo. Não é fonte, e acessibilidade se mede no `.tsx` que gera a tela.
#
# O QUE FICA DENTRO, de propósito: `portal/`, `n8n/`, `test/`, `docs/` e os
# geradores Python dos dois books (`test-data/book-*`) — o oráculo das suítes é
# código de verdade e merece ser lido como tal.
sonar.exclusions=db,test-data/capturas
