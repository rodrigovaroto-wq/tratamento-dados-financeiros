# CI — as quatro suítes, os geradores e o lint, em todo push e PR.
#
# POR QUE ESTE ARQUIVO EXISTE. Até a sessão 20 este repositório NÃO TINHA CI: as
# quatro suítes só rodavam quando alguém lembrava de rodá-las. O custo disso está
# registrado no HANDOFF e não é hipotético — a escala nunca aplicada (erro de
# ~496x), a coleta do SGS descartando ~792 observações, o hash que dormia em
# produção: todos rodavam SEM ERRO e entregavam número errado, por várias
# sessões. Nenhum é pego lendo o diff; todos são pegos pelas suítes.
#
# O QUE ELE COBRE, e por que cada peça:
#   • n8n            libs e nós simulados.
#   • geradores      regeram os 4 workflows E as 3 fixtures do book, com
#                    `git diff --exit-code` em cima. Sem essa segunda metade, o
#                    arquivo commitado pode divergir da fonte que o gera — e é o
#                    commitado que roda (o JSON que o dono importa no n8n, a
#                    fixture que as suítes leem). A fonte "certa" no repositório
#                    não conserta nem a produção nem o teste.
#   • export         invariantes do arquivo entregue ao cliente.
#   • db             migrations aplicadas do zero + testes SQL, contra Postgres 16.
#   • e2e            a ÚNICA suíte que cobre a costura extração → banco → export.
#                    As outras validam seu pedaço contra fixture escrita à mão nas
#                    duas pontas, e as duas pontas podem errar juntas.
#   • tsc/eslint/build  o portal tem de continuar compilando.
#
# A ORDEM É DELIBERADA: o que falha rápido e barato vem primeiro (lint, n8n,
# geradores), e o que precisa de banco vem depois.

name: suítes

on:
  push:
  pull_request:
  # DISPARO MANUAL — para reconferir um commit que ficou SEM execução.
  #
  # POR QUE ISTO EXISTE (incidente de 06/08/2026, registrado no HANDOFF). O GitHub
  # Actions ficou horas sem runner disponível: a execução no `main` esperou 15
  # minutos na fila e foi CANCELADA sem nunca começar (`runner_name` vazio), e os
  # pushes seguintes não criaram execução nenhuma. Dois PRs foram mergeados nesse
  # intervalo com a evidência sendo apenas a execução local das quatro suítes.
  #
  # E o GitHub NÃO reexecuta retroativamente: evento que não gerou execução não
  # ganha execução quando o serviço volta — não há o que reexecutar. Sem disparo
  # manual, a única forma de conferir o estado acumulado era empurrar um commit
  # vazio, que polui o histórico para resolver um problema de infraestrutura.
  #
  # `workflow_dispatch` aceita escolher a branch, então serve tanto para revalidar
  # o `main` depois de um incidente quanto para rodar a suíte numa branch antes de
  # abrir o PR. Ele só aparece na interface quando o arquivo está na branch
  # default — é exigência do GitHub, não escolha nossa.
  workflow_dispatch:

# Um PR que recebe três pushes seguidos não precisa de três execuções completas.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-latest

    services:
      postgres:
        # 16 é a versão do Supabase em uso e a que as migrations assumem.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Instalar dependências do portal
        # `--ignore-scripts` porque `npm ci` sem ele executa o postinstall de
        # QUALQUER dependência transitiva — código arbitrário de terceiro rodando
        # no runner, com o checkout e o token do job à mão, antes de a primeira
        # suíte começar.
        #
        # E ELE FOI MEDIDO, não presumido. O número vem do LOCK, não de memória:
        # `hasInstallScript` é verdadeiro em QUATRO pacotes — `esbuild`
        # (postinstall), `sharp` (install), `unrs-resolver` (postinstall) e
        # `fsevents` (install). No runner rodariam TRÊS: o `fsevents` é
        # `os: ["darwin"]` e opcional, e nunca chega a instalar no Linux. (Os
        # ~20 `prepare` da árvore não contam: `prepare` não roda para tarball do
        # registro, só para dependência de git ou link local.)
        #
        # Os três continuam funcionando sem o script porque o binário nativo de
        # cada um vem do pacote por plataforma em `optionalDependencies` — o
        # script só o confirma. Conferido na árvore REAL, não numa cópia:
        # `rm -rf node_modules` + `npm ci --ignore-scripts`, e em cima disso
        # `./node_modules/.bin/tsc --noEmit` limpo, `eslint .` limpo,
        # `next build` compilado, mais a suíte inteira (01/09).
        #
        # O QUE ESTA FLAG CUSTA, e fica registrado porque a memória
        # `portao-mede-a-entrada-de-producao` é exatamente sobre isso: a Vercel
        # roda o install DELA, COM scripts, e não lê este arquivo. A partir daqui
        # o portão mede uma instalação que não é a de produção. A troca é
        # deliberada — o risco de código de terceiro no runner é concreto e o
        # `next build` daqui nunca provou nada sobre o build da Vercel de qualquer
        # forma —, mas quem for investigar uma quebra que só aparece lá deve
        # começar por esta linha.
        working-directory: portal
        run: npm ci --ignore-scripts


      - name: Cliente psql 16
        # O runner traz um cliente, mas não necessariamente o 16. As migrations
        # usam sintaxe que não vale a pena depender da sorte da imagem.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-16 \
            || sudo apt-get install -y --no-install-recommends postgresql-client
          psql --version

      # ---- rápido e barato primeiro ---------------------------------------
      - name: Lint e tipos do portal
        # OS BINÁRIOS DO LOCK, CHAMADOS POR CAMINHO — a mesma razão já escrita no
        # passo da suíte de export mais abaixo, e a regra que o CLAUDE.md manda.
        # `npx tsc` não é o tsc deste `package-lock.json`: quando o npx não acha o
        # pacote ele BAIXA o que estiver publicado no registro no dia, sem versão
        # fixada e rodando os scripts de instalação desse pacote. Um portão que
        # muda de versão sozinho é um portão que muda de opinião sozinho.
        working-directory: portal
        run: |
          ./node_modules/.bin/tsc --noEmit
          ./node_modules/.bin/eslint .

      - name: Suíte n8n
        run: node --test 'N8N/test/*.test.mjs'

      - name: Suíte da sonda de produção (a tradução de "não perguntei" em veredito)
        # O portão agendado (`sonda-producao.yml`) roda contra um banco que ESTA suíte não tem.
        # O que dá para provar aqui é a única parte que decide alguma coisa: que "não consegui
        # perguntar" (código 2) nunca colapsa em "está tudo bem" (código 0). MEDIDO em 16/09 com
        # o colapso religado de propósito: 4 asserts reprovam.
        run: node --test 'Supabase/test/*.test.mjs'

      - name: Suíte dos hooks do agente
        # A trava que impede o descarte de arquivo é a única trava DURA do repositório, e ela erra
        # de duas formas opostas: deixando passar o comando destrutivo (trabalho não commitado
        # some, sem desfazer — foi a sessão 19) ou bloqueando o comando legítimo. A segunda já
        # aconteceu: a primeira versão casava sobre o comando inteiro e bloqueou uma MENSAGEM DE
        # COMMIT que descrevia o próprio hook. Portão que reprova por ruído é pior que portão
        # nenhum, então os casos que têm de PASSAR são a maioria da suíte.
        #
        # Ela também trava o fail-open: `JSON.parse("null")` devolve null SEM lançar, e um hook
        # que morre com stack trace vira um bloqueio acidental — no SessionStart, um que pode
        # impedir a sessão de começar.
        #
        # E desde 16/09 ela cobre o OUTRO erro do hook fail-open, o silencioso: `lembrar-derivados`
        # passou semanas com 3 das 4 regras casando caminhos que a renomeação de agosto extinguiu
        # (`n8n/`, `db/migrations/`, `test-data/`) — 4 das 5 entradas reais saíam mudas, e nada
        # acusava, porque lembrete ausente é idêntico a lembrete sem o que dizer. O glob abaixo já
        # inclui a suíte nova; ela exige que o caminho de exemplo de cada regra EXISTA, que é o que
        # descobre a próxima renomeação.
        run: node --test '.claude/hooks/test/*.test.mjs'

      - name: Geradores de workflow — e o gerado tem de ser igual ao commitado
        run: |
          node N8N/build-workflow.mjs
          node N8N/build-workflow-macro.mjs
          node N8N/build-workflow-diagnostico.mjs
          node N8N/build-workflow-erros.mjs
          # É o `git diff` que impede o JSON commitado de divergir da fonte.
          # Sem ele, o gerador vira documentação: o dono importa o JSON velho e
          # a correção fica no repositório sem chegar à produção.
          git diff --exit-code -- N8N/ \
            || { echo "::error::os workflows gerados divergem dos commitados — rode os 4 geradores e commite o resultado"; exit 1; }

      # ---- fixtures do book (insumo do export e do e2e) --------------------
      - name: Gerar o book sintético
        # PYTHONPATH=. é OBRIGATÓRIO (o gerar.py importa módulos irmãos), e o
        # GABARITO.json sai dentro de pdf/. Sem este passo o verificar-export
        # morre com ENOENT no GABARITO — não é bug, é insumo faltando.
        working-directory: Dados de Teste/book-vertentes
        run: |
          # VERSÃO PRESA, e não é higiene genérica: o book sintético é o ORÁCULO das
          # suítes, e `pip install reportlab` sem versão faz o CI baixar o que for a
          # última no dia. Um release que mude a renderização quebra o gerador — ou,
          # pior, muda o PDF sem quebrar nada e o oráculo passa a medir outra coisa.
          # 5.0.1 é a versão com que a suíte inteira roda verde (conferido em 21/08).
          # `--only-binary :all:` — achado do Sonar (`githubactions:S8541`), CI da base
          # (`main`) e desta PR: sem a flag, um pacote sem wheel cairia para instalar via
          # `setup.py`, que EXECUTA código arbitrário do pacote baixado. O reportlab==5.0.1
          # publica wheel `py3-none-any` (conferido em 16/09), então a flag não muda o que
          # é instalado — só fecha o caminho que executaria script de instalação.
          python3 -m pip install --quiet --only-binary :all: 'reportlab==5.0.1'
          PYTHONPATH=. python3 gerar.py

      # ---- os DERIVADOS do gerador do book, conferidos como os workflows ----
      - name: Fixtures derivadas do gerador do book (SQL, JSON) e git diff
        # POR QUE ESTE PASSO EXISTE (achado em 19/08/2026). Do MESMO
        # `Supabase/test/gerar_fixture.py` saem TRÊS artefatos versionados:
        #
        #   • Supabase/test/fixture_book_vertentes.sql        (suíte de banco)
        #   • portal/scripts/fixtures/book-vertentes.json (suíte de export)
        #   • Dados de Teste/book-vertentes/pdf/GABARITO.json  (gerado no passo acima)
        #
        # Os workflows do n8n já têm este portão desde a sessão 20, com o motivo
        # escrito: "o JSON commitado pode divergir da fonte que o gera". As
        # fixtures do book NÃO tinham, e o mesmo defeito aconteceu: uma correção
        # no `motor.py` (a calibração por PL-alvo deixou de escalar conta
        # intragrupo, ver a `0124`) mudou o SQL e o GABARITO, e o JSON ficou para
        # trás — a suíte de export reprovou em 5 itens comparando o export NOVO
        # com um gabarito NOVO a partir de uma fixture VELHA.
        #
        # O portão é o mesmo dos workflows, e por isso ele é barato: regera e
        # compara. Aqui ele é MAIS necessário que lá, porque as três pontas se
        # comparam entre si — desincronizar uma faz as outras duas mentirem sobre
        # a terceira.
        run: |
          cd "Dados de Teste"/book-vertentes
          PYTHONPATH=. python3 ../../Supabase/test/gerar_fixture.py > ../../Supabase/test/fixture_book_vertentes.sql
          PYTHONPATH=. python3 ../../Supabase/test/gerar_fixture.py --json > ../../portal/scripts/fixtures/book-vertentes.json
          cd ../book-canastra
          PYTHONPATH=. python3 ../../Supabase/test/gerar_fixture_canastra.py > ../../Supabase/test/fixture_book_canastra.sql
          cd ../..
          git diff --exit-code -- Supabase/test/fixture_book_vertentes.sql \
            portal/scripts/fixtures/book-vertentes.json \
            Supabase/test/fixture_book_canastra.sql \
            || { echo "::error::as fixtures commitadas divergem do gerador — rode os geradores de fixture e commite o resultado"; exit 1; }

      # ---- o book difícil: 38 documentos, 3 exercícios, e o custo do lote ----
      - name: Gerar o book-canastra
        # O gerador é o próprio teste do book: ele fecha o balanço das 6 empresas
        # nos 3 exercícios e confere cada anexo contra a conta do balanço que ele
        # detalha, por `assert`. Se um número deixar de bater, ele MORRE aqui —
        # antes de qualquer coisa rodar sobre um insumo mentiroso.
        working-directory: Dados de Teste/book-canastra
        run: PYTHONPATH=. python3 gerar.py

      # ---- o book distress (F2.4): PL negativo, covenant rompido, aging, extrato ----
      - name: Gerar o book-distress
        # Mesmo papel do passo acima: o `motor.validar()` é o teste. 16 identidades
        # por `assert` — balanço fecha nas 3 entidades × 3 anos, DRE = variação do
        # PL, DFC reconstrói o caixa sem linha de ajuste, aging AP = Fornecedores
        # do BP (14.900), extrato = caixa do BP (676), covenant 12,25x > 3,0x.
        # Medido não-vazio em 22/09/2026: 5 de 5 alterações no gerador reprovam.
        working-directory: Dados de Teste/book-distress
        run: PYTHONPATH=. python3 gerar.py

      - name: Custo do lote (medido no artefato, sem chamar a OpenAI)
        # Reprova quando um documento custa mais que a estimativa por chamada que
        # sustenta o teto de US$ 3 — que foi como se descobriu que o livro razão
        # custava US$ 0,1725 contra os US$ 0,15 então declarados.
        run: node N8N/medir-custo-book.mjs

      - name: Régua da cobertura (texto de PRODUÇÃO contra a verdade do gerador)
        # A guarda que decide se um documento veio pela metade depende de uma
        # HEURÍSTICA sobre o texto do PDF, e ela é confrontada aqui com a contagem
        # que o gerador declara — quantas linhas de conta ele escreveu.
        #
        # A ENTRADA É O TEXTO DE PRODUÇÃO, e isto é a correção de 31/08: até
        # então este passo media o `TEXTO_EXTRAIDO.json`, o agrupamento do
        # GERADOR, que produção nunca vê. Ele passava com "+3%" enquanto o
        # `17_Livro_Razao` dava 258 no n8n contra as 99 linhas reais e abria
        # pendência falsa. Agora a entrada é a captura versionada da execução
        # 7276 (`Dados de Teste/capturas/`), e o que não está nela é declarado NÃO
        # MEDIDO em vez de parecer aprovado.
        #
        # Reprova quando a régua sai da faixa (conta demais e come a folga do
        # limiar, ou conta de menos e deixa passar extração incompleta), e quando
        # um documento novo entra na classe do rótulo repetido.
        run: node N8N/medir-regua-cobertura.mjs

      - name: Índice do conhecimento — o grafo derivado bate com o repositório
        # A camada de memória deste repositório é DERIVADA: o `indexar.mjs` lê
        # git, migrations, código, CI e fichas, e emite `grafo.jsonl`. O portão
        # é o mesmo dos quatro workflows do n8n e do `schema.sql` — regera e
        # compara —, e existe pela mesma razão: índice commitado que diverge da
        # fonte manda a próxima sessão procurar no lugar errado.
        #
        # `conferir.mjs` é a outra metade: caminho de ficha que sumiu, suíte que
        # o CI não roda, âncora cuja região de código mudou (a ficha vira
        # SUSPEITA), e o PISO de cobertura — que é a regra 7 aplicada ao próprio
        # índice, porque uma regex que parou de casar continua verde e devolve
        # briefing curto, que se lê como "não há nada sobre isso".
        #
        # A TERCEIRA metade, acrescentada em 21/09/2026 depois de o portão abaixo
        # reprovar por um defeito que ele NÃO sabia nomear: o grafo tinha 50 nós de
        # `Verificação/saida/` (gitignored), porque a sessão rodou `variacoes.mts`
        # antes de `indexar.mjs`. O `git diff --exit-code` acusou "diverge", que é
        # verdade e é inútil — não diz que a causa foi artefato gerado. O teste
        # afirma o invariante direto e NOMEIA os caminhos: rodado contra aquele
        # grafo (070b0c2), reprova com 25 caminhos distintos.
        #
        # ELE RODA PRIMEIRO, E A ORDEM É O PONTO — achado da revisão independente.
        # Ligado DEPOIS do `indexar.mjs`, como ele estava na primeira versão, o teste
        # era MORTO: o `indexar.mjs` reescreve o `grafo.jsonl` antes dele, e o
        # `git diff --exit-code` já garantiu que o arquivo bate com o commitado,
        # gerado num checkout onde nada ignorado existe — a asserção ficava verdadeira
        # por construção sempre que a linha anterior passava. Pior, no cenário que ele
        # existe para nomear (alguém commita um grafo poluído) o `exit 1` do diff
        # abortava a etapa ANTES dele, com exatamente a mensagem inútil que ele veio
        # substituir. Rodando primeiro, ele lê o grafo COMMITADO — que é o estado de um
        # checkout limpo — e é o único ponto em que essa pergunta tem resposta.
        run: |
          node --test '.claude/conhecimento/test/*.test.mjs'
          node .claude/conhecimento/indexar.mjs
          git diff --exit-code -- .claude/conhecimento/grafo.jsonl \
            || { echo "::error::o grafo commitado diverge do repositório — rode node .claude/conhecimento/indexar.mjs e commite o resultado"; exit 1; }
          node .claude/conhecimento/conferir.mjs

      - name: Portão dos comandos de barra (todo subagent_type existe)
        # Despacho para `subagent_type` inexistente falha em tempo de execução, e
        # o comando só descobre isso no meio de uma tarefa de alguém. Medido na
        # primeira execução, contra os 52 comandos importados: 57 citações
        # quebradas, 30 nomes distintos, 13 comandos. Aqueles 52 saíram em
        # 16/09/2026 (`.claude/COMANDOS.md`) e o portão continua valendo para os
        # três escritos aqui. Não precisa de banco nem de build; roda em segundos.
        run: node .claude/verificar-comandos.mjs

      - name: Espelho CLAUDE.md ↔ CI (suítes e medidores)
        # O CLAUDE.md é lido por TODA sessão e é dele que sai a lista do que se
        # roda aqui. Quando ele fica para trás deste arquivo, ele manda a sessão
        # seguinte rodar MENOS do que o portão cobra — e ela relata "baseline
        # completa" sobre medição que não existe. Aconteceu duas vezes, as duas
        # achadas por acidente: sessão 82 (duas suítes fora, 18 asserts) e sessão
        # 86 (os dois medidores fora). O CLAUDE.md documentava os `grep` que
        # conferem isso; grep que alguém precisa lembrar de rodar não é portão.
        # Medido em 16/09/2026 com o espelho quebrado de propósito: 4 divergências
        # acusadas, incluindo arquivo citado que não existe.
        run: node .claude/verificar-espelho-claude-md.mjs

      - name: Suíte de export (invariantes do arquivo entregue)
        # O binário do lock, chamado por caminho. `npx tsx` NÃO serve aqui, e isto
        # foi medido na primeira execução do CI: mesmo com o .bin do portal no
        # PATH, o npx respondeu "package was not found and will be installed" e
        # baixou o tsx do registro — sem versão fixada, com o CI passando a
        # depender do que estiver publicado no dia.
        run: ./portal/node_modules/.bin/tsx portal/scripts/verificar-export.mts

      - name: Suíte da planilha de transcrição (ida e volta do formato)
        # A planilha da 0129 grava linha ACEITA, com autor e sem guarda nenhuma —
        # então um erro de leitura aqui não gera pendência: gera um número errado
        # que tem dono, e ninguém volta a desconfiar de número com dono. A suíte é
        # round-trip (gerar → .xlsx → ler) porque o defeito que interessa é a coluna
        # que muda de lugar em UMA das duas metades do formato.
        run: ./portal/node_modules/.bin/tsx portal/scripts/verificar-transcricao.mts

      - name: Suíte da mensagem de falha (o texto do dia ruim)
        # POR QUE ELA ESTÁ NO CI. Este é o único texto do sistema cujo defeito
        # não aparece enquanto tudo funciona: ele só é lido quando algo quebrou.
        # Uma assinatura que deixou de casar, ou uma frase que voltou a citar
        # ferramenta, não derruba tela nenhuma — e só se descobre no momento em
        # que alguém precisa de ajuda e recebe "deu erro".
        run: ./portal/node_modules/.bin/tsx portal/scripts/verificar-mensagem-de-falha.mts

      - name: Suíte das premissas sugeridas do realizado
        # A tela de Modelagem sugere oito premissas lidas do próprio balanço e da
        # própria DRE do caso, e o analista aceita com um clique — a partir daí
        # aquele número dirige a projeção inteira. Um erro aqui não tem sintoma:
        # produz um modelo que parece calibrado pelo histórico e não é. A suíte
        # trava as duas regras que sustentam isso: zero não é resposta, e a base de
        # cada razão é a MESMA que o modelo aplica ao projetar.
        run: ./portal/node_modules/.bin/tsx portal/scripts/verificar-premissas-do-realizado.mts

      - name: Suíte do Kit Básico (a tela pergunta ao banco, nunca rederiva a regra)
        # Escrita junto da 0157 e esquecida FORA do portão até 03/09 — achada por
        # um `comm` entre os verificar-*.mts que existem e os que o CI roda.
        # Invariante que não roda é invariante que apodrece: ela trava a tela
        # contra rederivar em TypeScript a regra do COMBINADO estrutural que a
        # 0157 pôs no banco, e sem ela as duas fontes voltam a divergir em
        # silêncio.
        run: ./portal/node_modules/.bin/tsx portal/scripts/verificar-kit-basico.mts

      - name: Suíte do limite de envio (o lote que a hospedagem recusa antes do código rodar)
        # 13/09/2026: 48 arquivos (~50 MB) para o mandato da AMO morreram em HTTP
        # 413 — da BORDA da Vercel, antes de `/api/intake` ser invocado. Nenhuma
        # mensagem em português do portal podia aparecer, e nenhuma correção
        # DENTRO da rota resolveria: o teto de ~4,5 MB por requisição é da
        # plataforma.
        #
        # Este portão trava as duas metades da correção: lote grande nunca é
        # mandado para a Function (é o 413 em si), e lote pequeno CONTINUA indo
        # por ela — que é o único caminho com status real e mensagem em
        # português. Medido com a correção desligada: 42 asserts reprovam sem o
        # caminho direto, 3 reprovam se a conta voltar a ser a soma dos arquivos
        # em vez do corpo do multipart.
        run: ./portal/node_modules/.bin/tsx portal/scripts/verificar-limite-de-envio.mts

      - name: Suíte da contagem por documento (o teto de 1000 do PostgREST não corta em silêncio)
        # A contagem "quantas linhas cada documento rendeu" morava em duas cópias,
        # e só uma paginava: o painel fazia uma consulta só, e o PostgREST corta
        # em 1000 linhas sem erro. Agora é uma função (`contarLinhasPorVersao`),
        # provada contra um servidor que corta em 1000 e em 500, e nenhuma leitura
        # de linhas de campo_extraido em portal/src fica fora do `paginar`.
        # Medido com a correção desligada: o painel antigo reprova 1 verificação;
        # a função sem paginar reprova 7.
        run: ./portal/node_modules/.bin/tsx portal/scripts/verificar-linhas-por-versao.mts

      - name: Suíte da cobertura da modelagem (o veredito não pinta 5% e 100% do mesmo verde)
        # A 0158 endureceu o `pronto` e publicou a FRAÇÃO de contas com premissa,
        # mas um número no banco que a tela não mostra não corrige nada: o chip
        # dizia "pronto para exportar" em verde sobre 23 de 480 linhas. Este
        # portão trava o comportamento da tela — inclusive o de NÃO inventar 0%
        # quando o banco não tem a 0158, que é estado normal aqui.
        run: ./portal/node_modules/.bin/tsx portal/scripts/verificar-modelagem-cobertura.mts

      # ---- o que precisa de banco -----------------------------------------
      - name: Suíte de banco (migrations do zero + testes SQL)
        run: Supabase/test/run.sh

      # O `Supabase/test/run.sh` acabou de reescrever `Supabase/schema.sql` a partir do banco
      # que ele montou do zero. Se o commitado divergir, o schema que o
      # repositório publica não é o que as migrations produzem — e é o publicado
      # que alguém vai ler para entender o banco.
      #
      # Mesmo idioma do espelho do n8n, e pela mesma razão: gerar sem conferir
      # deixa a fonte e o resultado divergirem em silêncio.
      - name: O schema materializado bate com as migrations
        run: |
          git diff --exit-code -- Supabase/schema.sql || {
            echo "::error::Supabase/schema.sql está desatualizado — rode Supabase/test/run.sh e commite o resultado."
            exit 1
          }

      - name: O que o código chama existe no banco
        # A OUTRA PONTA DA SONDA DE INSTALAÇÃO, e ela faltava.
        #
        # `fn_instalacao_conferir()` responde "o que ESTE banco sabe que deveria
        # ter, está aqui?" — e o catálogo dela mora dentro do banco, preenchido
        # pelas migrations. Medido em 02/09: um banco parado na 0150 (o estado
        # que o ESTADO.md declara para produção) não acusa requisito nenhum E
        # não tem `fn_abrir_lote_execucao` nem `fn_reconciliar_caso`, que dois
        # nós do workflow de ingestão chamam em TODA rodada. A sonda não pode
        # conhecer um requisito que só a 0156 escreveu.
        #
        # A pergunta que faltava é a que só o repositório pode fazer: **o que o
        # código que vai rodar chama, está aqui?** Aqui, contra o banco recém
        # montado, ela é verde por construção — o valor no CI é o outro: uma
        # chamada a função que migration nenhuma cria (nome trocado num rename,
        # `.rpc()` com typo) para de esperar produção para aparecer.
        run: CONFERIR_DB=tdf_test node Supabase/test/conferir-chamadas.mjs

      - name: O conferidor em SQL (o que o dono cola no SQL Editor) é gerado e diz PODE RODAR
        # `Supabase/conferir/conferir_chamadas.sql` se dizia gerado e não tinha
        # gerador: em 24/09/2026, 3 das 15 consultas já diferiam do workflow (dois
        # nós tinham ganhado `p_cnpj`, que tem default — a cópia velha dizia PODE
        # RODAR num banco sem ele). Agora ele sai de `gerar-conferir-chamadas.mjs`,
        # que lê os nós pelo MESMO módulo do `conferir-chamadas.mjs`; o `git diff`
        # prende o commitado ao gerado, e executá-lo aqui prova que o arquivo que
        # se cola funciona. Medido: com o .sql antigo, o `git diff` reprova nas 3.
        run: |
          node Supabase/conferir/gerar-conferir-chamadas.mjs > Supabase/conferir/conferir_chamadas.sql
          git diff --exit-code -- Supabase/conferir/conferir_chamadas.sql \
            || { echo "::error::conferir_chamadas.sql diverge do gerado — rode o gerador e commite"; exit 1; }
          psql -d tdf_test -X -v ON_ERROR_STOP=1 -f Supabase/conferir/conferir_chamadas.sql | tee /tmp/conferir.out
          grep -q "PODE RODAR" /tmp/conferir.out \
            || { echo "::error::o conferidor em SQL não disse PODE RODAR no banco completo"; exit 1; }

      - name: A sonda do buraco no meio não dá alarme falso num banco completo
        # CONTROLE POSITIVO da detecção de buraco da `sonda-producao.mjs` (PR #238). Contra
        # este banco, montado com TODAS as migrations, a resposta tem de ser zero buracos.
        # A primeira versão do critério passou verde nos testes e acusaria 0163 e 0171 em
        # produção — o teste montava "produção" a partir da saída da própria função testada,
        # e o remédio que a sonda manda ("aplique as pendentes") reaplicaria a 0171, que
        # reemite fn_upsert_entidade e desfaz 18 migrations. Este passo é o que impede o
        # critério de voltar a ser testado só contra ele mesmo.
        run: SONDA_PSQL="psql -d tdf_test" node Supabase/test/sonda-producao.mjs --so-buraco

      - name: Suíte e2e (extração → banco → export)
        run: ./portal/node_modules/.bin/tsx Verificação/run.mts

      - name: Arnês de variações — a cadeia real sobre documento sujo
        # POR QUE ELE ESTÁ NO CI. Cinco rodadas de variantes trocadas por completo
        # acharam cinco defeitos que nenhuma das outras suítes pega, porque todas
        # elas medem a ingestão sobre extração FIEL. Documento de mandato real não
        # é fiel, e as variantes que pegaram cada defeito ficaram aqui como
        # religamento — desfazer qualquer uma das cinco correções deixa este passo
        # vermelho. Leva ~6 min no runner: o primeiro minuto e meio é montar o MOLDE
        # (as 84 migrations, uma vez), e cada variante depois clona dele em 0,2 s.
        #
        # SEM `env:` DE PROPÓSITO — ele herda o do job (o serviço `postgres:16` em
        # `localhost:5432`), exatamente como o passo do e2e acima. A primeira versão
        # trazia `PGHOST: /tmp`, que é onde o socket fica NA MINHA MÁQUINA e não
        # existe no runner: o passo morria em `connection to server on socket
        # "/tmp/.s.PGSQL.5432" failed`. Configuração de sandbox copiada para o CI é
        # o jeito mais bobo de deixar um portão vermelho.
        run: ./portal/node_modules/.bin/tsx Verificação/variacoes.mts

      - name: Build do portal
        # O binário do lock, pelo mesmo motivo do passo de lint e tipos: `npx next`
        # sem versão baixaria o Next publicado no dia, e não o `next` que o
        # `package-lock.json` fixa e que o portal em produção usa.
        working-directory: portal
        run: ./node_modules/.bin/next build
